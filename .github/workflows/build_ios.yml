name: Build iOS (IPA)

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  ios:
    name: Build iOS IPA (红果-阿帝版)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          gomobile init

      - name: Rebuild OpenhongguoCore with V5 playback protocol
        run: |
          git clone https://github.com/Sxuan-Coder/openhongguo.git /tmp/openhongguo
          cd /tmp/openhongguo/bindings/mobile/core
          gomobile bind -target ios,iossimulator -iosversion 13 -trimpath -ldflags="-s -w" -o /tmp/OpenhongguoCore.xcframework .
          python3 -c "
          with open('/tmp/OpenhongguoCore.xcframework/ios-arm64/OpenhongguoCore.framework/OpenhongguoCore', 'rb') as f:
              data = f.read()
          print('multi_video_model check:', b'multi_video_model' in data)
          assert b'multi_video_model' in data, 'ERROR: multi_video_model missing!'
          "

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Patch cached openhongguo with newly compiled OpenhongguoCore
        run: |
          find "$HOME" -name "OpenhongguoCore.xcframework" -type d 2>/dev/null | while read -r dir; do
            if [[ "$dir" != "/tmp/OpenhongguoCore.xcframework"* ]]; then
              echo "Found and replacing: $dir"
              rm -rf "$dir"
              cp -R /tmp/OpenhongguoCore.xcframework "$dir"
            fi
          done

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r -q "HongGuo-AdiBan.ipa" Payload
          ls -lh HongGuo-AdiBan.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HongGuo-AdiBan-iOS-IPA
          path: build/ios/ipa/HongGuo-AdiBan.ipa
          retention-days: 14
