# 构建未签名 iOS IPA 并作为 artifact 上传（不发布 Release）。
#
# 手动触发：Actions -> Build iOS IPA (unsigned) -> Run workflow。
# 用途：Windows / Linux 上编不了 iOS，这是唯一能产出 IPA 的通路；
# 产物未签名，需 AltStore / SideStore / Sideloadly 自签安装。
#
# 注意：iOS 的播放链路（media_kit + 内容密钥解密）尚未在真机验证，
# 能出包不等于能播放。
#
# 本工作流改造自本仓库 fork alexchan2001/open-apex-drama 的版本：
# 版本号改为从 pubspec.yaml 读取（不再硬编码），Podfile 已入库，
# 因此删掉了「缺失时现场生成 Podfile」那一步。

name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  ios:
    name: Build unsigned iOS IPA
    # macos-latest 的 arm64 池容量不足时，job 排队 15 分钟拿不到跑机就会失败；
    # 钉死 macos-15 换一个更稳的跑机池。
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # pubspec 的 version 形如 1.5.1+151，取加号前的部分做文件名。
      # 注意用块标量：sed 表达式里的「: 」在未加引号的 YAML 标量中不合法。
      - name: Read app version
        id: version
        run: |
          echo "value=$(sed -n 's/^version: *//p' pubspec.yaml | head -1 | cut -d+ -f1)" >> "$GITHUB_OUTPUT"

      - name: Build iOS (release, no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          set -eu
          cd build/ios/iphoneos
          rm -rf Payload
          mkdir -p Payload
          cp -r Runner.app Payload/
          ipa="ApexDrama-${{ steps.version.outputs.value }}_ios_unsigned.ipa"
          ditto -c -k --sequesterRsrc --keepParent Payload "$ipa"
          ls -lh "$ipa"
          mkdir -p "$GITHUB_WORKSPACE/out"
          mv "$ipa" "$GITHUB_WORKSPACE/out/"

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: out/*.ipa
          if-no-files-found: error
